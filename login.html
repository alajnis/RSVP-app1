<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Login</title>

    <!-- NO error handlers - let browser handle silently -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- SUPABASE LOCAL (Vendorized) -->
    <script src="vendor/supabase.js"></script>
    <script src="supabase-client.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Bodoni Moda"', 'serif'],
                        sans: ['"Work Sans"', 'sans-serif'],
                        script: ['"Pinyon Script"', 'cursive']
                    },
                    colors: {
                        brand: {
                            crimson: '#C42745',
                            beige: '#F4ECE8',
                            pink: '#F6D8D9',
                            dark: '#1A1A1A'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-beige min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md">
        <div class="bg-white shadow-2xl border border-brand-pink p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-brand-crimson"></div>

            <h1 class="text-4xl font-serif font-bold text-brand-dark mb-2 mt-4">Bienvenido</h1>
            <p class="font-script text-2xl text-brand-crimson mb-8">Events Boutique</p>

            <form @submit.prevent="login">
                <div class="mb-8">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                        Ingresa tu clave
                    </label>
                    <input type="text" v-model="password"
                        class="w-full px-4 py-3 border border-brand-pink bg-brand-beige/20 focus:border-brand-crimson outline-none transition-all text-center tracking-widest text-lg"
                        placeholder="" autofocus>
                </div>

                <div v-if="error" class="mb-6 text-xs font-bold text-brand-crimson uppercase tracking-widest">
                    {{ error }}
                </div>

                <button type="submit"
                    class="w-full bg-brand-dark text-white py-4 font-bold tracking-[0.2em] uppercase text-xs hover:bg-brand-crimson transition-all shadow-xl">
                    Ingresar
                </button>
            </form>
        </div>

        <!-- MODAL: CODIGOS DISPONIBLES (reemplaza el alert() nativo, que cortaba la lista con muchos casamientos) -->
        <div v-if="showHelpModal"
            class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-sm"
            @click.self="showHelpModal = false">
            <div class="bg-white w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl border border-brand-pink text-left">
                <div class="flex items-center justify-between px-6 py-4 border-b border-brand-pink shrink-0">
                    <h3 class="font-serif text-xl font-bold text-brand-dark">Códigos disponibles</h3>
                    <button @click="showHelpModal = false"
                        class="text-brand-dark/40 hover:text-brand-crimson transition-all text-2xl leading-none">
                        &times;
                    </button>
                </div>
                <div class="px-6 py-4 border-b border-brand-pink shrink-0">
                    <input type="text" v-model="helpSearch" placeholder="Buscar por nombre..."
                        class="w-full px-4 py-2 border border-brand-pink bg-brand-beige/20 focus:border-brand-crimson outline-none transition-all text-sm">
                </div>
                <div class="overflow-y-auto px-6 py-4 space-y-1">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Administración</p>
                    <div class="text-sm text-brand-dark mb-4">
                        <div>• admin</div>
                        <div>• usuario</div>
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                        Casamientos ({{ filteredHelpCodes.length }})
                    </p>
                    <div v-if="filteredHelpCodes.length === 0" class="text-xs text-slate-400 py-4 text-center">
                        No se encontraron casamientos
                    </div>
                    <div v-for="entry in filteredHelpCodes" :key="entry.code" class="text-sm text-brand-dark py-0.5">
                        • {{ entry.code }} <span class="text-slate-400">({{ entry.coupleName }})</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const password = ref('');
                const error = ref('');
                const projects = ref([]);
                const showHelpModal = ref(false);
                const helpSearch = ref('');

                // Cargar proyectos de Supabase al iniciar
                onMounted(async () => {
                    try {
                        if (!window.supabase) {
                            console.error('Supabase client no disponible');
                            return;
                        }

                        const { data, error: err } = await window.supabase
                            .from('projects')
                            .select('*');

                        if (err) {
                            console.error('Error cargando proyectos:', err);
                            return;
                        }

                        projects.value = (data || []).map(p => ({
                            id: p.id,
                            brideName: p.bride_name,
                            groomName: p.groom_name,
                            coupleName: p.couple_name || `${p.bride_name} & ${p.groom_name}`,
                            weddingDate: p.wedding_date,
                            loginCode: p.login_code || null
                        }));

                        console.log(`✅ ${projects.value.length} proyectos cargados`);
                    } catch (e) {
                        console.error('Error en onMounted:', e);
                    }
                });

                // Generar códigos de pareja
                // Prioridad: usar login_code guardado en DB (si existe).
                // Fallback dinámico para proyectos creados antes de esta feature.
                const getProjectCodes = (project) => {
                    try {
                        if (!project.brideName || !project.groomName) return [];
                        const clean = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, '');
                        const b = clean(project.brideName);
                        const g = clean(project.groomName);

                        if (project.loginCode) {
                            // Tiene clave guardada en DB: aceptar también la variante inversa
                            // (ej: si loginCode=anaycarlos, también aceptar carlosyana)
                            const reverseCode = `${g}y${b}`;
                            const codes = [project.loginCode];
                            // Solo agregar inverso si es diferente al principal
                            if (reverseCode !== project.loginCode) codes.push(reverseCode);
                            return codes;
                        }

                        // Fallback: generar dinámicamente (proyectos viejos sin login_code en DB)
                        return [
                            `${b}y${g}`,   // brendaylucas
                            `${g}y${b}`    // lucasybrenda
                        ];
                    } catch (e) {
                        return [];
                    }
                };

                // Lista completa de códigos para el modal de "help", filtrable por nombre.
                const allHelpCodes = computed(() => {
                    return projects.value
                        .map(p => {
                            const codes = getProjectCodes(p);
                            return codes.length > 0 ? { code: codes[0], coupleName: p.coupleName } : null;
                        })
                        .filter(Boolean);
                });

                const filteredHelpCodes = computed(() => {
                    const q = helpSearch.value.trim().toLowerCase();
                    if (!q) return allHelpCodes.value;
                    return allHelpCodes.value.filter(entry =>
                        entry.coupleName.toLowerCase().includes(q) || entry.code.toLowerCase().includes(q)
                    );
                });

                const login = async () => {
                    try {
                        error.value = '';
                        const input = password.value.trim().toLowerCase();

                        if (!input) {
                            error.value = 'Por favor ingresa una clave';
                            return;
                        }

                        // Help command
                        if (input === 'help') {
                            helpSearch.value = '';
                            showHelpModal.value = true;
                            password.value = '';
                            return;
                        }

                        // Admin login (mismos permisos para 'admin' y 'usuario')
                        if (input === 'admin' || input === 'usuario') {
                            localStorage.setItem('rsvp_session', JSON.stringify({ role: 'admin' }));
                            window.location.href = 'dashboard.html';
                            return;
                        }

                        // Couple login - buscar en proyectos
                        const foundProject = projects.value.find(p => {
                            const codes = getProjectCodes(p);
                            return codes.includes(input);
                        });

                        if (foundProject) {
                            // Guardar sesión con ID real del proyecto
                            localStorage.setItem('rsvp_session', JSON.stringify({
                                role: 'couple',
                                projectId: foundProject.id,
                                coupleName: foundProject.coupleName
                            }));

                            // Log de ingreso
                            try {
                                const logs = JSON.parse(localStorage.getItem('login_logs') || '[]');
                                logs.push({
                                    projectId: foundProject.id,
                                    userName: foundProject.coupleName,
                                    method: `Código: ${input}`,
                                    timestamp: new Date().toISOString(),
                                    ipAddress: null
                                });
                                localStorage.setItem('login_logs', JSON.stringify(logs));
                            } catch (e) {
                                console.error('Error logging entrada:', e);
                            }

                            window.location.href = `wedding.html?project=${foundProject.id}`;
                        } else {
                            error.value = 'Clave incorrecta';
                        }
                    } catch (e) {
                        console.error('Error en login:', e);
                        error.value = 'Error al ingresar';
                    }
                };

                return { password, error, login, showHelpModal, helpSearch, filteredHelpCodes };
            }
        }).mount('#app');
    </script>

    <!-- Footer -->
    <div class="fixed bottom-4 left-0 right-0 text-center text-[11px] text-slate-400 z-50 pointer-events-none">
        <span class="pointer-events-auto">Desarrollado por <a href="https://impruvia.netlify.app/" target="_blank" class="text-brand-crimson hover:underline font-semibold">Impruvia</a> para <a href="https://www.sfeventsboutique.com/" target="_blank" class="text-brand-crimson hover:underline font-semibold">Events Boutique</a></span>
    </div>
</body>

</html>
