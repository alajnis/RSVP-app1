<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Login</title>

    <!-- Suppress ALL errors -->
    <script>
        window.onerror = function () { return true; };
        window.addEventListener('error', function (e) { e.preventDefault(); return true; }, true);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Bodoni Moda"', 'serif'],
                        sans: ['"Work Sans"', 'sans-serif'],
                        script: ['"Pinyon Script"', 'cursive']
                    },
                    colors: {
                        brand: {
                            crimson: '#C42745',
                            beige: '#F4ECE8',
                            pink: '#F6D8D9',
                            dark: '#1A1A1A'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-beige min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white shadow-2xl border border-brand-pink p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-brand-crimson"></div>

            <h1 class="text-4xl font-serif font-bold text-brand-dark mb-2 mt-4">Bienvenido</h1>
            <p class="font-script text-2xl text-brand-crimson mb-8">Events Boutique</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="mb-8">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
                        Ingresa tu clave
                    </label>
                    <input type="text" id="password"
                        class="w-full px-4 py-3 border border-brand-pink bg-brand-beige/20 focus:border-brand-crimson outline-none transition-all text-center tracking-widest text-lg"
                        placeholder="" autofocus>
                </div>

                <div id="error" class="mb-6 text-xs font-bold text-brand-crimson uppercase tracking-widest hidden">
                </div>

                <button type="submit"
                    class="w-full bg-brand-dark text-white py-4 font-bold tracking-[0.2em] uppercase text-xs hover:bg-brand-crimson transition-all shadow-xl">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <script>
        // Simplified login - NO external dependencies
        function handleLogin(event) {
            event.preventDefault();

            const input = document.getElementById('password').value.trim().toLowerCase();
            const errorDiv = document.getElementById('error');

            errorDiv.classList.add('hidden');

            if (!input) {
                showError('Por favor ingresa una clave');
                return false;
            }

            // Help command
            if (input === 'help') {
                alert('Códigos disponibles:\n\n• admin\n• larayale\n• alelara');
                return false;
            }

            // Admin login
            if (input === 'admin') {
                localStorage.setItem('rsvp_session', JSON.stringify({ role: 'admin' }));
                window.location.href = 'dashboard.html';
                return false;
            }

            // Couple logins (hardcoded for now)
            if (input === 'larayale' || input === 'alelara' || input === 'lara&ale' || input === 'ale&lara') {
                localStorage.setItem('rsvp_session', JSON.stringify({
                    role: 'couple',
                    projectId: '1',
                    coupleName: 'Lara & Ale'
                }));
                window.location.href = 'dashboard.html';
                return false;
            }

            showError('Clave incorrecta');
            return false;
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>

</html>
