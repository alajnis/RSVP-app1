<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Migración: login_code</title>
    <script src="vendor/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1 { color: #38bdf8; }
        p  { color: #94a3b8; }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px 4px;
        }
        button:hover { background: #0284c7; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        #log {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
            margin-top: 20px;
            min-height: 120px;
            max-height: 500px;
            overflow-y: auto;
        }
        .ok  { color: #4ade80; }
        .err { color: #f87171; }
        .inf { color: #60a5fa; }
        .warn{ color: #facc15; }
    </style>
</head>

<body>
    <h1>🔧 Migración: columna <code>login_code</code></h1>
    <p>Esta página agrega la columna <strong>login_code</strong> a la tabla <code>projects</code>
       para evitar colisión de claves cuando dos casamientos tienen los mismos nombres.</p>
    <p>Solo necesitás ejecutarla <strong>una sola vez</strong>.</p>

    <button onclick="runMigration()">▶️ Ejecutar Migración</button>
    <button onclick="checkStatus()">🔍 Verificar Estado</button>
    <button class="danger" onclick="document.getElementById('log').textContent = ''">🗑 Limpiar log</button>

    <div id="log">Presiona "Verificar Estado" primero para chequear si ya se aplicó...</div>

    <script>
        const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3Njk0NTgwNjMsImV4cCI6MjA4NDgxODA2M30.C7tJzBMvE9eONUHHGfTSfekBoBxD9ShPBfOOZyIyMZ8';
        const BASE_URL = 'https://rsvp.boutique-rsvp.com';

        const log = document.getElementById('log');

        function print(msg, cls = '') {
            const line = document.createElement('span');
            line.className = cls;
            line.textContent = msg + '\n';
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        // Llama al endpoint pg-meta de Supabase self-hosted para ejecutar SQL arbitrario
        async function execSQL(sql) {
            const res = await fetch(`${BASE_URL}/pg/query`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SERVICE_KEY}`,
                    'apikey': SERVICE_KEY
                },
                body: JSON.stringify({ query: sql })
            });

            const text = await res.text();
            let json;
            try { json = JSON.parse(text); } catch { json = { raw: text }; }

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${JSON.stringify(json)}`);
            }
            return json;
        }

        async function checkStatus() {
            log.innerHTML = '';
            print('🔍 Verificando estado de la migración...', 'inf');
            try {
                const result = await execSQL(`
                    SELECT column_name, data_type
                    FROM information_schema.columns
                    WHERE table_name = 'projects'
                      AND column_name = 'login_code';
                `);

                const rows = result?.rows || result;
                if (Array.isArray(rows) && rows.length > 0) {
                    print('✅ La columna login_code YA EXISTE. Migración ya aplicada.', 'ok');
                    print(`   Tipo: ${rows[0].data_type}`, 'ok');

                    // Mostrar valores actuales
                    const data = await execSQL(`SELECT id, bride_name, groom_name, login_code FROM projects ORDER BY created_at;`);
                    const proyectos = data?.rows || data;
                    print('\n📋 Proyectos actuales:', 'inf');
                    (proyectos || []).forEach(p => {
                        print(`   ${p.bride_name} & ${p.groom_name} → login_code: ${p.login_code || '(vacío)'}`, 
                              p.login_code ? 'ok' : 'warn');
                    });
                } else {
                    print('⚠️  La columna login_code NO EXISTE todavía. Ejecuta la migración.', 'warn');
                }
            } catch (e) {
                print('❌ Error al verificar: ' + e.message, 'err');
                print('', '');
                print('💡 Si el error dice "404" o "Not Found", el endpoint pg/query no está habilitado.', 'warn');
                print('   En ese caso, contactá a Antigravity para usar la alternativa via SSH.', 'warn');
            }
        }

        async function runMigration() {
            log.innerHTML = '';
            print('🚀 Iniciando migración...', 'inf');

            try {
                // PASO 1: Agregar columna
                print('\n📌 Paso 1: Agregar columna login_code...', 'inf');
                await execSQL(`ALTER TABLE projects ADD COLUMN IF NOT EXISTS login_code text;`);
                print('✅ Columna login_code agregada.', 'ok');

                // PASO 2: Crear índice único
                print('\n📌 Paso 2: Crear índice único...', 'inf');
                await execSQL(`CREATE UNIQUE INDEX IF NOT EXISTS projects_login_code_unique ON projects (login_code);`);
                print('✅ Índice único creado.', 'ok');

                // PASO 3: Rellenar proyectos existentes
                print('\n📌 Paso 3: Generar login_code para proyectos existentes...', 'inf');
                const result = await execSQL(`
                    UPDATE projects
                    SET login_code = LOWER(
                        REGEXP_REPLACE(bride_name, '[^a-zA-Z0-9]', '', 'g')
                    ) || 'y' || LOWER(
                        REGEXP_REPLACE(groom_name, '[^a-zA-Z0-9]', '', 'g')
                    )
                    WHERE login_code IS NULL
                      AND bride_name IS NOT NULL
                      AND groom_name IS NOT NULL
                    RETURNING id, bride_name, groom_name, login_code;
                `);

                const updated = result?.rows || result;
                if (Array.isArray(updated) && updated.length > 0) {
                    print(`✅ ${updated.length} proyecto(s) actualizados:`, 'ok');
                    updated.forEach(p => {
                        print(`   ${p.bride_name} & ${p.groom_name} → ${p.login_code}`, 'ok');
                    });
                } else {
                    print('ℹ️  No había proyectos para actualizar (o ya tenían login_code).', 'inf');
                }

                print('\n========================================', 'ok');
                print('✅ MIGRACIÓN COMPLETADA EXITOSAMENTE', 'ok');
                print('========================================', 'ok');
                print('\nLos novios existentes pueden seguir usando su clave anterior.', 'inf');
                print('Nuevos proyectos con nombres duplicados obtendrán clave única (ej: anaycarlos1).', 'inf');

            } catch (e) {
                print('\n========================================', 'err');
                print('❌ ERROR: ' + e.message, 'err');
                print('========================================', 'err');
                print('', '');
                print('💡 Si el error dice "404" o "Not Found":', 'warn');
                print('   El endpoint /pg/query no está habilitado en tu configuración de Kong.', 'warn');
                print('   Necesitamos acceder via SSH al VPS para ejecutar el SQL directamente.', 'warn');
                print('   Avisá a Antigravity para guiarte por ese camino.', 'warn');
            }
        }

        // Auto-check al cargar
        window.addEventListener('load', () => setTimeout(checkStatus, 800));
    </script>
</body>

</html>
