<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Credenciales Supabase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #C42745;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .field {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            font-family: monospace;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f9f9f9;
            font-size: 14px;
        }

        button {
            background: #000;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

        .help {
            background: #eef;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Reparación de Credenciales</h1>

        <div class="help">
            <strong>Instrucciones:</strong><br>
            1. Dale al botón "GENERAR NUEVAS CLAVES".<br>
            2. Copia estos valores y pégalos en las variables de entorno de <strong>Dokploy -> Supabase ->
                Environment</strong>.<br>
            3. <strong>Pégalos también en el chat con la IA</strong> para que pueda actualizar tu código.
        </div>

        <button onclick="generate()">GENERAR NUEVAS CLAVES</button>

        <div style="margin-top: 30px;">
            <div class="field">
                <label>JWT_SECRET (Pegar en Dokploy)</label>
                <textarea id="jwt_secret" readonly></textarea>
            </div>

            <div class="field">
                <label>ANON_KEY (Pegar en Dokploy y Chat)</label>
                <textarea id="anon_key" readonly></textarea>
            </div>

            <div class="field">
                <label>SERVICE_ROLE_KEY (Pegar en Dokploy)</label>
                <textarea id="service_key" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        function base64url(source) {
            // Encode in classical base64
            encodedSource = CryptoJS.enc.Base64.stringify(source);

            // Remove padding equal characters
            encodedSource = encodedSource.replace(/=+$/, '');

            // Replace characters according to base64url specifications
            encodedSource = encodedSource.replace(/\+/g, '-');
            encodedSource = encodedSource.replace(/\//g, '_');

            return encodedSource;
        }

        function sign(payload, secret) {
            const header = { "alg": "HS256", "typ": "JWT" };
            const stringifiedHeader = CryptoJS.enc.Utf8.parse(JSON.stringify(header));
            const encodedHeader = base64url(stringifiedHeader);

            const stringifiedData = CryptoJS.enc.Utf8.parse(JSON.stringify(payload));
            const encodedData = base64url(stringifiedData);

            const token = encodedHeader + "." + encodedData;

            const signature = CryptoJS.HmacSHA256(token, secret);
            const encodedSignature = base64url(signature);

            return token + "." + encodedSignature;
        }

        function generate() {
            // 1. Generate random 40-char secret
            const randomWord = CryptoJS.lib.WordArray.random(32); // 32 bytes = 256 bits
            const secret = base64url(randomWord); // Using base64url as string rep

            document.getElementById('jwt_secret').value = secret;

            // 2. Constants
            const iat = Math.floor(Date.now() / 1000);
            const exp = iat + (10 * 365 * 24 * 60 * 60); // 10 years

            // 3. Anon Payload
            const anonPayload = {
                "role": "anon",
                "iss": "supabase",
                "iat": iat,
                "exp": exp
            };

            // 4. Service Payload
            const servicePayload = {
                "role": "service_role",
                "iss": "supabase",
                "iat": iat,
                "exp": exp
            };

            // 5. Sign
            const anonKey = sign(anonPayload, secret);
            const serviceKey = sign(servicePayload, secret);

            document.getElementById('anon_key').value = anonKey;
            document.getElementById('service_key').value = serviceKey;
        }
    </script>

</body>

</html>
