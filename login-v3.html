<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Login (V3)</title>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- CONFIGURACIÓN CENTRALIZADA -->
    <script src="supabase-client.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Bodoni Moda"', 'serif'],
                        sans: ['"Work Sans"', 'sans-serif'],
                        script: ['"Pinyon Script"', 'cursive']
                    },
                    colors: {
                        brand: {
                            crimson: '#C42745',
                            beige: '#F4ECE8',
                            pink: '#F6D8D9',
                            dark: '#1A1A1A'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-beige min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md">
        <div class="bg-white shadow-2xl border border-brand-pink p-8 text-center relative overflow-hidden">
            <!-- Decorative Header -->
            <div class="absolute top-0 left-0 w-full h-2 bg-brand-crimson"></div>

            <h1 class="text-4xl font-serif font-bold text-brand-dark mb-2 mt-4">Bienvenido</h1>
            <p class="font-script text-2xl text-brand-crimson mb-8">Events Boutique</p>

            <form @submit.prevent="login">
                <div class="mb-8">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Ingresa tu
                        clave</label>
                    <input type="text" v-model="password"
                        class="w-full px-4 py-3 border border-brand-pink bg-brand-beige/20 focus:border-brand-crimson outline-none transition-all text-center tracking-widest text-lg"
                        placeholder="" autofocus>
                </div>

                <div v-if="error" class="mb-6 text-xs font-bold text-brand-crimson uppercase tracking-widest">
                    {{ error }}
                </div>

                <div v-if="debugMsg"
                    class="mb-4 text-[10px] text-slate-400 font-mono text-left bg-slate-100 p-2 rounded overflow-x-auto">
                    DEBUG: {{ debugMsg }}
                </div>

                <button type="submit"
                    class="w-full bg-brand-dark text-white py-4 font-bold tracking-[0.2em] uppercase text-xs hover:bg-brand-crimson transition-all shadow-xl">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        // Use the global supabase client from supabase-client.js
        const supabaseClient = window.supabase;

        createApp({
            setup() {
                const password = ref('');
                const error = ref('');
                const projects = ref([]);
                const debugMsg = ref('');

                onMounted(async () => {
                    if (!supabaseClient) {
                        error.value = 'Error crítico: No se pudo conectar a la base de datos.';
                        return;
                    }

                    // Cargar proyectos
                    try {
                        const { data, error: err } = await supabaseClient.from('projects').select('*');

                        if (err) {
                            console.error('Error loading projects:', err);
                            debugMsg.value = `Advertencia: No se pudieron cargar proyectos (${err.message})`;
                            return;
                        }

                        debugMsg.value = `✅ ${data.length} proyectos cargados`;

                        // Map snake_case (DB) to camelCase (App)
                        projects.value = data.map(p => ({
                            id: p.id,
                            brideName: p.bride_name,
                            groomName: p.groom_name,
                            coupleName: p.couple_name || `${p.bride_name} & ${p.groom_name}`,
                            weddingDate: p.wedding_date
                        }));

                    } catch (e) {
                        console.error('Exception loading projects:', e);
                        debugMsg.value = `Error: ${e.message}`;
                    }
                });

                const getProjectCodes = (project) => {
                    try {
                        if (!project.brideName || !project.groomName) return [];
                        const clean = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, '');

                        const b = clean(project.brideName);
                        const g = clean(project.groomName);

                        // Generate password: bridename + groomname (e.g., "larayale")
                        return [
                            `${b}${g}`,      // larayale
                            `${g}${b}`       // alelara (también aceptado)
                        ];
                    } catch (e) {
                        return [];
                    }
                };

                const login = async () => {
                    try {
                        error.value = '';
                        const input = password.value.trim().toLowerCase();

                        if (!input) {
                            error.value = 'Por favor ingresa una clave';
                            return;
                        }

                        // HELP command - show all passwords (internal use only)
                        if (input === 'help') {
                            const passwords = ['admin'];
                            projects.value.forEach(p => {
                                const codes = getProjectCodes(p);
                                if (codes.length > 0) {
                                    passwords.push(`${codes[0]} (${p.coupleName || p.brideName + ' & ' + p.groomName})`);
                                }
                            });
                            alert('🔑 Claves disponibles:\n\n' + passwords.join('\n'));
                            return;
                        }

                        // 1. Admin Login
                        if (input === 'admin') {
                            localStorage.setItem('rsvp_session', JSON.stringify({ role: 'admin' }));
                            window.location.href = 'dashboard.html';
                            return;
                        }

                        // 2. Couple Login
                        const foundProject = projects.value.find(p => {
                            const possibleCodes = getProjectCodes(p);
                            return possibleCodes.includes(input);
                        });

                        if (foundProject) {
                            // Log Entry usando el cliente local
                            await supabaseClient.from('login_logs').insert({
                                project_id: foundProject.id,
                                couple_name: foundProject.coupleName || `${foundProject.brideName} & ${foundProject.groomName}`
                            });

                            // Set Session
                            localStorage.setItem('rsvp_session', JSON.stringify({
                                role: 'couple',
                                projectId: foundProject.id,
                                coupleName: foundProject.coupleName || `${foundProject.brideName} & ${foundProject.groomName}`
                            }));
                            window.location.href = 'dashboard.html';
                        } else {
                            error.value = 'Clave incorrecta';
                        }
                    } catch (e) {
                        alert('Error al intentar ingresar: ' + e.message);
                        console.error(e);
                    }
                };

                return { password, login, error, debugMsg };
            }
        }).mount('#app');
    </script>
</body>

</html>
