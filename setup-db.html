<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Setup</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <h1>Inicializar Base de Datos</h1>
    <p>Este script creará las tablas necesarias en Supabase.</p>

    <label>Ingresa la SERVICE_ROLE_KEY:</label><br>
    <input type="text" id="serviceKey" style="width:100%;padding:10px;margin:10px 0;"
        placeholder="Pegar aquí la SERVICE_ROLE_KEY de Dokploy"><br>

    <button onclick="runSetup()" style="padding:10px 20px;background:black;color:white;cursor:pointer;">CREAR TABLAS
        AHORA</button>

    <div id="logs" style="margin-top:20px;background:#f0f0f0;padding:10px;white-space:pre-wrap;"></div>

    <script>
        // URL de tu Supabase que ya configuramos
        const SUPABASE_URL = 'https://rsvp.boutique-rsvp.com';

        async function runSetup() {
            const key = document.getElementById('serviceKey').value.trim();
            const logDiv = document.getElementById('logs');

            if (!key) { alert('Falta la key'); return; }

            const supabase = supabase.createClient(SUPABASE_URL, key, {
                auth: { persistSession: false }
            });

            log('Iniciando setup...');

            // SQL Commands
            const sql = `
-- 1. TABLA PROYECTOS
create table if not exists projects (
  id text primary key,
  bride_name text,
  groom_name text,
  couple_name text,
  wedding_date text,
  venue text,
  created_at timestamptz default now(),
  updated_at timestamptz default now()
);

-- 2. TABLA MESAS
create table if not exists tables (
  id text primary key,
  project_id text references projects(id) on delete cascade,
  name text,
  capacity int,
  created_at timestamptz default now()
);

-- 3. TABLA INVITADOS
create table if not exists guests (
  id text primary key,
  project_id text references projects(id) on delete cascade,
  first_name text,
  last_name text,
  email text,
  phone text,
  guests_confirmed int,
  rsvp_status text,
  dietary text,
  sub_guests jsonb,
  created_at timestamptz default now()
);

-- 4. TABLA ASIGNACIONES
create table if not exists assignments (
  id text primary key,
  project_id text references projects(id) on delete cascade,
  table_id text references tables(id) on delete cascade,
  rsvp_id text references guests(id) on delete cascade,
  sub_guest_idx int,
  created_at timestamptz default now()
);

-- 5. TABLA LOGS
create table if not exists login_logs (
  id bigint generated by default as identity primary key,
  project_id text,
  couple_name text,
  timestamp timestamptz default now()
);

-- 6. RLS
alter table projects enable row level security;
alter table tables enable row level security;
alter table guests enable row level security;
alter table assignments enable row level security;
alter table login_logs enable row level security;

create policy "Enable all access for anon" on projects for all using (true) with check (true);
create policy "Enable all access for anon" on tables for all using (true) with check (true);
create policy "Enable all access for anon" on guests for all using (true) with check (true);
create policy "Enable all access for anon" on assignments for all using (true) with check (true);
create policy "Enable all access for anon" on login_logs for all using (true) with check (true);

-- 7. SEED DATA
insert into projects (id, bride_name, groom_name, couple_name, wedding_date, venue)
values ('proj_sample_001', 'Lara', 'Ale', 'Lara & Ale', '2026-11-20', 'Palacio Sans Souci')
ON CONFLICT (id) DO NOTHING;

insert into guests (id, project_id, first_name, last_name, email, phone, guests_confirmed, rsvp_status, dietary, sub_guests)
values 
  ('guest_001', 'proj_sample_001', 'Ricardo', 'Lopez', 'ricardo@email.com', '1155550001', 4, 'Confirmed', 'None', '[{"firstName": "Ricardo", "lastName": "Lopez", "status": "Confirmed", "dietary": "None"}]'::jsonb),
  ('guest_002', 'proj_sample_001', 'Carlos', 'Gomez', 'carlos@email.com', '1155550002', 2, 'Pending', 'None', '[{"firstName": "Carlos", "lastName": "Gomez", "status": "Pending", "dietary": "None"}]'::jsonb)
ON CONFLICT (id) DO NOTHING;
            `;

            try {
                // Usamos la API REST de Supabase para ejecutar SQL crudo (Solo posible con Service Role)
                // Usamos una función RPC si existe, o llamada directa a la API de postgres si está expuesta.
                // Como pg_meta es difícil de acceder externamente sin Studio, usaremos un truco:
                // Intentaremos insertar directametne en 'projects'. Si falla por 'relation does not exist', confirmamos que no hay tablas.
                // PERO... el cliente JS no puede ejecutar "CREATE TABLE".

                // NOTA: Tienes razón, el cliente JS estándar NO puede ejecutar DDL (Create table).
                // Necesitamos usar la API de 'sql' que expone pg-meta, pero esa suele estar cerrada.

                log('AVISO: El cliente estándar de JS no permite crear tablas por seguridad.');
                log('Intentando verificar conexión básica primero...');

                const { data, error } = await supabase.from('projects').select('*').limit(1);

                if (error) {
                    log('Error de conexión: ' + error.message);
                    if (error.message.includes('relation "projects" does not exist')) {
                        log('CONFIRMADO: Las tablas NO existen.');
                        log('Lamentablemente, para CREAR tablas necesitas acceso SQL (Studio) o acceso directo a la BD.');
                    }
                } else {
                    log('¡Éxito! La tabla projects existe. Datos: ' + JSON.stringify(data));
                }

            } catch (e) {
                log('Error fatal: ' + e.message);
            }
        }

        function log(msg) {
            document.getElementById('logs').innerHTML += msg + '\n';
        }
    </script>
</body>

</html>
