<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Seating - Events Boutique</title>

    <!-- CRITICAL: Suppress cross-origin errors BEFORE loading external resources -->
    <script>
        window.onerror = function () { return true; };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bodoni Moda', Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #C42745 0%, #1A1A1A 100%);
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .subtitle {
            font-family: 'Pinyon Script', cursive;
            font-size: 2rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        p {
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            opacity: 0.9;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Pinyon+Script&family=Work+Sans:wght@300;400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>RSVP</h1>
        <div class="subtitle">Events Boutique</div>
        <div class="spinner"></div>
        <p id="status">Verificando sesión...</p>
    </div>

    <script>
        try {
            // Check for existing session
            const session = localStorage.getItem('rsvp_session');

            if (session) {
                // User is logged in - go to dashboard
                document.getElementById('status').textContent = 'Redirigiendo al dashboard...';
                window.location.replace('dashboard.html');
            } else {
                // No session - go to login
                document.getElementById('status').textContent = 'Redirigiendo al login...';
                window.location.replace('login-v3.html');
            }
        } catch (e) {
            // Fallback: always go to login on error
            window.location.replace('login-v3.html');
        }
    </script>
</body>

</html>
