<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=login-v3.html">
    <title>RSVP - Events Boutique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #C42745 0%, #1A1A1A 100%);
            color: white;
        }

        .loader {
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 2.5em;
            margin: 0;
        }

        p {
            font-size: 1.2em;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>Events Boutique</h1>
        <p>Redirigiendo...</p>
    </div>

    <script>
        // Fallback if meta refresh doesn't work
        setTimeout(() => {
            window.location.href = 'login-v3.html';
        }, 100);
    </script>
</body>

</html>
